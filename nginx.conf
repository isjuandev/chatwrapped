server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión de texto (los .zip/.png ya vienen comprimidos)
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Seguridad. connect-src 'self': la app (y la analítica) no envía datos a terceros.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

  # Analítica propia (Umami) desde el mismo dominio: la CSP no cambia y los
  # bloqueadores no ven un proveedor externo. El resolver de Docker + la variable
  # en proxy_pass dejan arrancar nginx aunque Umami esté caído (502 hasta que suba).
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /medicion/script.js {
    set $umami http://umami:3000;
    proxy_pass $umami/script.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Solo el colector de eventos; el panel de Umami vive en su propio subdominio.
  location = /medicion/api/send {
    set $umami http://umami:3000;
    proxy_pass $umami/api/send;
    proxy_http_version 1.1;
    client_max_body_size 64k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /medicion/ {
    return 404;
  }

  # Assets con hash: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Healthcheck para Docker/Coolify
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # SPA: todo lo demás cae en index.html (sin caché para tomar versiones nuevas)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
